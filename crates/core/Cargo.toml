[package]
name = "buaa-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
browser-fallback = ["dep:tungstenite", "dep:tempfile"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
curl-sys = { version = "0.4", default-features = false }
socket2 = "0.6"
regex = "1"
url = "2"
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"
zeroize = { version = "1", features = ["derive", "serde"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"], optional = true }
tempfile = { version = "3", optional = true }

[target.'cfg(not(windows))'.dependencies]
curl = { version = "0.4", default-features = false, features = ["ssl"] }

[target.'cfg(windows)'.dependencies]
curl = { version = "0.4", default-features = false, features = ["ssl", "static-curl"] }
windows-sys = { workspace = true, features = ["Win32_System_JobObjects"] }
