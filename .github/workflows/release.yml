name: Build and release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - name: Validate Windows GUI script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/platform/windows/BUAALogin.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - run: python tools/build.py windows
      - name: Test bundled Windows runtime
        shell: pwsh
        run: '& ./build/windows/BUAALogin/runtime/python.exe -m unittest discover -s tests -v'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: releases/BUAALogin-Windows-x64.zip
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: arm64
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: releases/BUAALogin-Mac-arm64.zip
          if-no-files-found: error

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Verify container fails without credentials
        shell: bash
        run: |
          docker build -t buaalogin:smoke .
          set +e
          output=$(docker run --rm --network none buaalogin:smoke 2>&1)
          code=$?
          set -e
          test "$code" -eq 1
          echo "$output" | grep -q 'USERNAME'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [windows, macos, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish desktop packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.zip --target "$COMMIT" --title "BUAALogin $RELEASE_TAG" --notes "Windows x64 与 macOS ARM 桌面版；Docker 镜像见本仓库的 GHCR Packages。"
