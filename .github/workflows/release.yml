name: Native build and preview release

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      promote_native:
        description: 'After completing the documented real-device acceptance, publish native as latest'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Build and package Windows
        run: ./tools/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: releases/BUAALogin-Windows-x64.zip
          if-no-files-found: error

  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Build and package macOS
        run: ./tools/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: releases/BUAALogin-Mac-arm64.zip
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          PROMOTE: ${{ inputs.promote_native }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "$image:native-preview"
            echo "$image:sha-$COMMIT"
            if [ "$PROMOTE" = true ]; then echo "$image:latest"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [windows, macos, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifacts
      - name: Publish desktop packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: native-${{ github.run_number }}-${{ github.run_attempt }}
          COMMIT: ${{ github.sha }}
          PROMOTE: ${{ inputs.promote_native }}
        run: |
          options=(--prerelease)
          if [ "$PROMOTE" = true ]; then options=(--latest); fi
          gh release create "$RELEASE_TAG" artifacts/*.zip --target "$COMMIT" \
            --title "BUAALogin $RELEASE_TAG" "${options[@]}" \
            --notes 'Rust 共享内核、原生桌面界面；首次使用须重新输入凭据。Docker 预览镜像标签 native-preview。正式替换前须完成仓库 docs/acceptance.md 的实机与能耗验收。'
